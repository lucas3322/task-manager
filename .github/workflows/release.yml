name: Release Desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente para publicar (ex. v0.4.0)
        required: true
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      ORBITASK_API_URL: ${{ vars.ORBITASK_API_URL || 'https://task-manager-production-8ff8.up.railway.app/api/v1' }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbitask/desktop build
      - run: pnpm --filter @orbitask/desktop exec electron-builder ${{ matrix.target }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
