appId: com.orbitask.app
productName: Orbitask
copyright: Copyright © 2026 Orbitask

directories:
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target: [dmg, zip]
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: build/icon.png

npmRebuild: false
